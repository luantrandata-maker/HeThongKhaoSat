 const SC=B.secs.map((x,i)=>({id:x.id,survey_id:s.id,title:x.title,description:x.description||null,position:i+1}));if(SC.length){r=await sb.from("survey_sections").upsert(SC);if(r.error)throw r.error}
 const QS=[],OP=[];B.secs.forEach((sc,i)=>sc.qs.forEach((q,j)=>{let vi=q.vraw;if(q.vq){const v=q.vop=="in"?String(q.vval).split(",").map(x=>x.trim()).filter(Boolean):q.vop=="eq"||q.vop=="neq"?q.vval:undefined;vi={all:[{q:q.vq,op:q.vop,...(v!==undefined?{value:v}:{})}]}}else if(!q.vraw)vi=null;
  QS.push({id:q.id,survey_id:s.id,section_id:sc.id,code:q.code,type:q.type,label:q.label,help:q.help||null,required:!!q.required,position:j+1,default_value:q.dv?J(q.dv,null):null,rules:J(q.rulesText,{}),visible_if:vi,allow_other:!!q.allow_other,config:J(q.cfgText,{})});
  if(["single_choice","multi_choice","dropdown"].includes(q.type))(q.optText||"").split("\n").filter(x=>x.trim()).forEach((l,k)=>{const[v,lb,d,im,m]=l.split("|");OP.push({question_id:q.id,value:v.trim(),label:(lb||v).trim(),description:d||null,image_path:im||null,meta:J(m,{}),position:k+1})})}));
 if(B.del.q.length){const c=await sb.from("responses").select("id",{count:"exact",head:true}).eq("survey_id",s.id);if(c.count&&!confirm("Khảo sát đã có phản hồi. Xóa câu hỏi sẽ xóa luôn câu trả lời tương ứng. Tiếp tục?"))return;r=await sb.from("questions").delete().in("id",B.del.q);if(r.error)throw r.error}
 if(B.del.s.length){r=await sb.from("survey_sections").delete().in("id",B.del.s);if(r.error)throw r.error}
 if(QS.length){r=await sb.from("questions").upsert(QS);if(r.error)throw r.error;r=await sb.from("question_options").delete().in("question_id",QS.map(x=>x.id));if(r.error)throw r.error;if(OP.length){r=await sb.from("question_options").insert(OP);if(r.error)throw r.error}}
 alert("Đã lưu khảo sát.");build(s.id)}catch(e){alert("Lỗi khi lưu: "+(e.message||e))}}
async function resp(sid){const V=$("#v"),{data:S}=await sb.from("surveys").select("id,title").order("updated_at",{ascending:false});sid=sid||R?.sid||S?.[0]?.id;
 if(!sid){V.innerHTML="<p>Chưa có khảo sát.</p>";return}
 const[qs,rs]=await Promise.all([sb.from("questions").select("id,code,type,label,survey_sections(position),position").eq("survey_id",sid),sb.from("responses").select("id,submitted_at,response_answers(question_id,value)").eq("survey_id",sid).order("submitted_at",{ascending:false}).limit(5000)]);
 const Q=qs.data.filter(q=>q.type!="heading").sort((a,b)=>a.survey_sections.position-b.survey_sections.position||a.position-b.position);
 R={sid,Q,rows:(rs.data||[]).map(r=>({id:r.id,t:r.submitted_at,a:Object.fromEntries(r.response_answers.map(x=>[x.question_id,x.value]))})),q:R?.sid==sid?R.q:"",f:R?.sid==sid?R.f:"",to:R?.sid==sid?R.to:""};drawResp(S)}
const txt=v=>Array.isArray(v)?v.join("; "):v??"";
function rows(){const{rows,q,f,to}=R;return rows.filter(r=>(!f||r.t>=f)&&(!to||r.t<=to+"T23:59:59")&&(!q||JSON.stringify(Object.values(r.a)).toLowerCase().includes(q.toLowerCase())))}
function drawResp(S){const V=$("#v"),L=rows();S=S||R.S;R.S=S;
 const st=R.Q.filter(q=>["single_choice","multi_choice","dropdown","rating"].includes(q.type)).map(q=>{const c={};L.forEach(r=>{const v=r.a[q.id];(Array.isArray(v)?v:v==null?[]:[v]).forEach(x=>c[x]=(c[x]||0)+1)});const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...e.map(x=>x[1]));return`<div class="card"><b>${esc(q.label)}</b>${e.map(x=>`<div class="hb"><span style="width:40%">${esc(x[0])}</span><div style="width:${x[1]/mx*45}%"></div><b>${x[1]}</b></div>`).join("")||"<p class=m>Chưa có dữ liệu</p>"}</div>`}).join("");
 V.innerHTML=`<div class="row"><select id="rs" style="max-width:300px">${S.map(x=>`<option value="${x.id}" ${x.id==R.sid?"selected":""}>${esc(x.title)}</option>`).join("")}</select><input id="rq" style="max-width:200px" placeholder="🔍 Tìm phản hồi" value="${esc(R.q)}"><input type="date" id="rf" style="max-width:150px" value="${R.f}"><input type="date" id="rt" style="max-width:150px" value="${R.to}"><span class="sp"></span><b>${L.length} phản hồi</b><button id="csv">CSV</button><button id="xls">XLSX</button></div>
 <div class="card" style="margin-top:10px;overflow:auto"><table><tr><th>Thời điểm gửi</th>${R.Q.slice(0,4).map(q=>`<th>${esc(q.label.slice(0,28))}</th>`).join("")}<th></th></tr>${L.slice(0,200).map(r=>`<tr><td>${fmt(r.t)}</td>${R.Q.slice(0,4).map(q=>`<td>${esc(String(txt(r.a[q.id])).slice(0,60))}</td>`).join("")}<td><button data-vr="${r.id}">Chi tiết</button> <button class="d x" data-dr="${r.id}">✕</button></td></tr>`).join("")}</table></div><h3>Thống kê theo câu hỏi</h3>${st}`}
function table(){return rows().map(r=>({"Thời điểm gửi":fmt(r.t),...Object.fromEntries(R.Q.map(q=>[q.label,txt(r.a[q.id])]))}))}
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.p&&(t.tagName=="INPUT"||t.tagName=="TEXTAREA")&&t.type!="checkbox"&&t.type!="file"){setP(B,t.dataset.p,t.type=="color"||t.type=="datetime-local"||t.type=="number"?t.value:t.value)}
 if(t.id=="rq"){R.q=t.value;drawResp();const i=$("#rq");i.focus();i.setSelectionRange(99,99)}});
document.addEventListener("change",async e=>{const t=e.target;if(t.dataset.p&&(t.type=="checkbox"||t.tagName=="SELECT")){setP(B,t.dataset.p,t.type=="checkbox"?t.checked:t.value);if(/\.type$|\.code$|\.vq$/.test(t.dataset.p)||t.dataset.p=="s.dedupe_question")build()}
 if(t.dataset.p&&/\.code$/.test(t.dataset.p))build();
 if(t.dataset.up&&t.files[0]){const f=t.files[0],p=`${B.s.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,"_")}`,{error}=await sb.storage.from("survey-assets").upload(p,f);if(error)return alert(error.message);B.s[t.dataset.up]=p;build()}
 if(t.dataset.mvs&&t.value){const[i,j]=t.dataset.mvs.split(".").map(Number),[q]=B.secs[i].qs.splice(j,1);B.secs[+t.value].qs.push(q);build()}
 if(t.id=="rs"){R={sid:t.value};resp(t.value)}if(t.id=="rf"){R.f=t.value;drawResp()}if(t.id=="rt"){R.to=t.value;drawResp()}});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.go)go(d.go);else if(t.id=="out"){await sb.auth.signOut();boot()}
 else if(t.id=="li"){const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});error?login("Email hoặc mật khẩu không đúng."):boot()}
 else if(t.id=="new")build(null);else if(d.edit)build(d.edit);else if(t.id=="bk")go("list");else if(t.id=="save")save();
 else if(d.st){const[id,s]=d.st.split("|"),{error}=await sb.from("surveys").update({status:s}).eq("id",id);if(error)alert(error.message);list()}
 else if(d.dup)dup(d.dup);
 else if(d.del){if(!confirm("Xóa khảo sát này? Chỉ xóa được khi chưa có phản hồi."))return;const{error}=await sb.from("surveys").delete().eq("id",d.del);if(error)alert(error.message);list()}
 else if(t.id=="as"){B.secs.push({id:uid(),title:"Phần "+(B.secs.length+1),description:"",qs:[],_new:1});build()}
 else if(d.aq){B.secs[d.aq].qs.push(Object.assign(nq(),{vq:"",vop:"filled",vval:"",optText:"",rulesText:"{}",cfgText:"{}"}));build()}
 else if(d.rs){if(!confirm("Xóa phần này cùng toàn bộ câu hỏi?"))return;const[s]=B.secs.splice(d.rs,1);B.del.s.push(s.id);s.qs.forEach(q=>B.del.q.push(q.id));build()}
 else if(d.rq){const[i,j]=d.rq.split(".").map(Number),[q]=B.secs[i].qs.splice(j,1);B.del.q.push(q.id);build()}
 else if(d.mv){const[k,p,n]=d.mv.split("|"),m=+n;if(k=="s"){const i=+p,a=B.secs;if(a[i+m]){[a[i],a[i+m]]=[a[i+m],a[i]]}}else{const[i,j]=p.split(".").map(Number),a=B.secs[i].qs;if(a[j+m])[a[j],a[j+m]]=[a[j+m],a[j]]}build()}
 else if(d.vr){const r=R.rows.find(x=>x.id==d.vr),m=document.createElement("div");m.className="md";m.innerHTML=`<div><b>Phản hồi lúc ${fmt(r.t)}</b>${R.Q.map(q=>`<p><small>${esc(q.label)}</small><br>${esc(txt(r.a[q.id]))||"—"}</p>`).join("")}<button onclick="this.closest('.md').remove()">Đóng</button></div>`;document.body.append(m)}
 else if(d.dr){if(confirm("Xóa phản hồi này?")){await sb.from("responses").delete().eq("id",d.dr);resp(R.sid)}}
 else if(t.id=="csv"){const T=table(),h=Object.keys(T[0]||{}),c=[h,...T.map(r=>h.map(k=>r[k]))].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");dl("phan-hoi.csv",new Blob(["\ufeff"+c],{type:"text/csv"}))}
 else if(t.id=="xls"){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(table()),"Phản hồi");XLSX.writeFile(w,"phan-hoi.xlsx")}});
boot();
</script></body></html>
